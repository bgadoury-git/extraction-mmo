apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: orchestrator-pod-manager
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["create", "get", "list", "watch", "delete"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: orchestrator-pod-manager-binding
  namespace: default
subjects:
  - kind: ServiceAccount
    name: default
    namespace: default
roleRef:
  kind: Role
  name: orchestrator-pod-manager
  apiGroup: rbac.authorization.k8s.io
