apiVersion: apps/v1
kind: Deployment
metadata:
  name: gatekeeper
  namespace: extraction-mmo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gatekeeper
  template:
    metadata:
      labels:
        app: gatekeeper
    spec:
      serviceAccountName: gatekeeper
      containers:
        - name: gatekeeper
          image: extractionmmoacr.azurecr.io/gatekeeper:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
            - name: quic
              containerPort: 3001
              protocol: UDP
          env:
            - name: REDIS_URL
              value: "redis://redis:6379"
            - name: K8S_NAMESPACE
              value: "extraction-mmo"
            - name: CERT_SECRET_NAME
              value: "extraction-mmo-certs"
            - name: RUST_LOG
              value: "info"
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
