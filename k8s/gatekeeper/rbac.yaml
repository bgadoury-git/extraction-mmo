apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gatekeeper
  namespace: extraction-mmo
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gatekeeper
  namespace: extraction-mmo
subjects:
  - kind: ServiceAccount
    name: gatekeeper
    namespace: extraction-mmo
roleRef:
  kind: Role
  apiGroup: rbac.authorization.k8s.io
  name: gatekeeper
