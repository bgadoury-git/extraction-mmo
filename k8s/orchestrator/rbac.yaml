apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: orchestrator
  namespace: extraction-mmo
rules:
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["create", "delete", "get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: orchestrator
  namespace: extraction-mmo
subjects:
  - kind: ServiceAccount
    name: orchestrator
    namespace: extraction-mmo
roleRef:
  kind: Role
  apiGroup: rbac.authorization.k8s.io
  name: orchestrator
