apiVersion: v1
kind: Service
metadata:
  name: gatekeeper
spec:
  selector:
    app: gatekeeper
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gatekeeper
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gatekeeper
  template:
    metadata:
      labels:
        app: gatekeeper
    spec:
      containers:
        - name: gatekeeper
          image: gatekeeper_infonuagique:latest
          ports:
            - containerPort: 3000
            - containerPort: 3001
              protocol: UDP
          env:
            - name: REDIS_URL
              value: "redis://redis:6379"
          volumeMounts:
            - name: certs
              mountPath: /certs
              readOnly: true
      volumes:
        - name: certs
          emptyDir: {}
